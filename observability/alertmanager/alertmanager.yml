global:
  resolve_timeout: 5m
  # Local SMTP catcher (Mailpit) so alert emails have somewhere to
  # actually land for local dev/testing — no real mail server needed.
  # View them at http://localhost:8025. Point smtp_smarthost at a real
  # relay for production.
  smtp_smarthost: 'mailpit:1025'
  smtp_from: 'alerts@shopsphere.local'
  smtp_require_tls: false

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    email_configs:
      - to: 'oncall@shopsphere.local'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']
