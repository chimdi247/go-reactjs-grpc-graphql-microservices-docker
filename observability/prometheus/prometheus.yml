global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: account
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['account:8081']
        labels: {service: account}

  - job_name: catalog
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['catalog:8081']
        labels: {service: catalog}

  - job_name: order
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['order:8081']
        labels: {service: order}

  - job_name: graphql-gateway
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['graphql:8081']
        labels: {service: graphql-gateway}

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
        labels: {service: otel-collector}

  # host-level CPU / memory / disk / network ("node" metrics)
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels: {service: node-exporter}

  # per-container CPU / memory (docker containers = our "nodes" in compose)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: {service: cadvisor}
